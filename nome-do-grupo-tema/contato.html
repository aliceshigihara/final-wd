<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | [Nome do Projeto]</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/gooey-navbar.css">
    <script src="js/gooey-navbar.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="img/logo.png" alt="[Descrição da logo do projeto]">
        </a>
        <nav class="main-nav gooey-nav" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a class="active" href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <section class="section">
            <h1>[Título da página de Contato]</h1>
            <p>[Texto de introdução do formulário]</p>
        </section>
        <section class="form-section">
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input id="name" name="name" type="text" required>
                    <small class="error-message" id="name-error"></small>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" required>
                    <small class="error-message" id="email-error"></small>
                </div>
                <div class="form-group">
                    <label for="phone">Telefone</label>
                    <input id="phone" name="phone" type="tel" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label for="message">Mensagem</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                    <small class="error-message" id="message-error"></small>
                </div>
                <button class="button" type="submit">Enviar</button>
                <p id="form-feedback" class="form-feedback" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>[detroit] &copy; 2026</p>
    </footer>
    <script src="js/script.js"></script>
    <script>
    (()=>{const q=new URLSearchParams(location.search),plan=q.get('plano'),value=Number(q.get('valor'));if(['mensal','anual'].includes(plan)&&Number.isFinite(value)&&value>0){document.getElementById('message').value=`Gostaria de solicitar informações sobre a contratação de um androide no plano ${plan}, com orçamento de ${value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}.`;}})();
    </script>
</body>
</html>
