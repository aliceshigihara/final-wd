        new MagicRings('#magic-rings-home', {

            lineThickness: 1.5,
            glow: 1,
            baseRadius: 0.24,
            radiusStep: 0.08,
            expansion: 0.08,
            rotation: 0,
            spin: 0.08,
            tilt: 0.12,
            followMouse: true,
            mouseInfluence: 0.18,

            grain: 0.08,
