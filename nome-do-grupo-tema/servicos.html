<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços | DBH IFC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/gooey-navbar.css">
    <script src="js/gooey-navbar.js" defer></script>
</head>
<body>
    <div id="letter-glitch-services" class="letter-glitch" aria-hidden="true"></div>
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="img/logo.png" alt="[Descrição da logo do projeto]">
        </a>
        <nav class="main-nav gooey-nav" aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a class="active" href="servicos.html">Serviços</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <section class="section">
            <h1>Catálogo CyberLife</h1>
            <p>Modelos androides disponíveis para aquisição e serviços especializados.</p>
        </section>

        <section class="gallery-section">
            <h2>Selecione um modelo</h2>
            <div class="gallery">
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>DBH IFC &copy; 2026</p>
    </footer>
    <script src="js/profile-card.js"></script>
    <script src="js/letter-glitch.js"></script>
    <script>


        const androides = [
            {
                name: 'Connor',
                title: 'Modelo RK800 • Unidade de investigação',
                handle: 'DETROIT POLICE DEPT.',
                status: 'R$ 89.900',
                avatarUrl: 'img/imagem-1.jpg'
            },
            {
                name: 'Kara',
                title: 'Modelo AX400 • Assistente doméstica',
                handle: 'LINHA RESIDENCIAL',
                status: 'R$ 42.500',
                avatarUrl: 'img/imagem-2.jpg'
            },
            {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
            {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
                        {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
                        {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
            {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
            {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            },
                        {
                name: 'Markus',
                title: 'Modelo RK200 • Assistente de cuidados',
                handle: 'UNIDADE PARTICULAR',
                status: 'R$ 68.300',
                avatarUrl: 'img/imagem-3.jpg'
            }
        ];

        for (const android of androides) {
            const card = document.createElement('article');
            card.className = 'gallery-item';
            document.querySelector('.gallery').appendChild(card);

            new ProfileCard(card, {
                name: android.name,
                title: android.title,
                handle: android.handle,
                status: android.status,
                contactText: 'Adquirir',
                avatarUrl: android.avatarUrl,
                miniAvatarUrl: android.avatarUrl,
                theme: 'dark',
                holo: 0.8,
                glare: 0.5,
                tiltStrength: 12,
                enableTilt: true,
                intro: true
            });
        }

        // Background opcional: nunca impede a renderização do catálogo.
        try {
            new LetterGlitch('#letter-glitch-services', {
                glitchColors: ['#38bdf8', '#1e3fd8', '#a5d8ff', '#ffffff'],
                baseColor: '#08152f',
                baseOpacity: 0.14,
                fontSize: 14,
                spacing: 0.7,
                density: 0.55,
                glitchAmount: 0.5,
                speed: 1,
                smooth: true,
                interactive: true,
                cursorRadius: 140,
                clickEffect: 'tear',
                flow: 0.5,
                edgeFade: 0.15,
                centerFade: 0,
                intro: true,
                lightMode: false,
                backgroundColor: '#08152f'
            });
        } catch (error) {
            console.warn("LetterGlitch indisponível:", error);
        }
    </script>
</body>
</html>
